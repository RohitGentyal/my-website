<body>
  <div class="veil" aria-hidden="true"></div>

  <header class="p-top">

  <section class="gate" id="gate" aria-label="A sunlit classical gate: marble columns framing a blue sky, snowy mountains and a green valley, with doves and white flowers">

      <div class="rule" aria-hidden="true"><i>✦</i><i>✦</i></div>
      <h1>Between the boxes</h1>
      <div class="rule" aria-hidden="true"><i>✦</i><i>✦</i></div>
      <div class="sides"><span>Notes app</span><span id="year-side"></span></div>
      <p class="quote">Short poems, written between screens.</p>
    </div>
    <div class="flutter" aria-hidden="true">
      <svg class="bfly b1" viewBox="0 0 40 30"><use href="#bfly"/></svg>
      <svg class="bfly b2" viewBox="0 0 40 30"><use href="#bfly"/></svg>
      <svg class="bfly b3" viewBox="0 0 40 30"><use href="#bfly"/></svg>
    </div>
  </section>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="wing" cx="35%" cy="40%" r="75%">
        <stop offset="0" stop-color="#ffb347"/>
        <stop offset=".65" stop-color="#e8741f"/>

      <g id="bfly">

        <path d="M20 8v15" stroke="#2a1406" stroke-width="1.6" stroke-linecap="round"/>

  <section class="band">
    <p class="sub">Written in a notes app, set here in ink.</p>
    <div class="meander" aria-hidden="true"></div>
  </section>

  <main class="page">
    <div class="poems" id="poems" aria-live="polite"></div>

  <footer class="p-foot">
    <div class="sprig" id="sprig-foot"></div>
    <p>© <span id="yr"></span> Rohit · <a class="back" href="index.html#end" data-turn="paper">Back to the hill</a></p>
  </footer>
