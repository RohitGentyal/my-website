<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poems — Rohit</title>
  <meta name="description" content="Short poems by Rohit, written in a notes app, between screens.">
  <meta name="theme-color" content="#3f78c6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@200;400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/poems/scene.webp" fetchpriority="high">
  <link rel="stylesheet" href="poems.css?v=10">
</head>
<body>
  <div class="veil" aria-hidden="true"></div>

  <header class="p-top">
    <a class="back" href="index.html#end" data-turn="paper"><span aria-hidden="true">←</span> Back to the hill</a>
    <span class="p-mark">Poems</span>
    <span class="p-year" id="year-top"></span>
  </header>

  <section class="gate" id="gate" aria-label="A sunlit classical gate: marble columns framing a blue sky, snowy mountains and a green valley, with white flowers in front">
    <img class="gl g-sky" src="assets/poems/scene.webp" width="1536" height="864" alt="" fetchpriority="high" decoding="async">
    <img class="gl g-front" src="assets/poems/columns.webp" width="1536" height="864" alt="" decoding="async">
    <img class="gl g-near" src="assets/poems/flowers.webp" width="1536" height="864" alt="" decoding="async">
    <div class="poster" id="poster">
      <p class="kicker">Poems by Rohit</p>
      <div class="rule" aria-hidden="true"><i>✦</i><i>✦</i></div>
      <h1>Between the boxes</h1>
      <div class="rule" aria-hidden="true"><i>✦</i><i>✦</i></div>
      <div class="sides"><span>Notes app</span><span id="year-side"></span></div>
      <p class="quote">Short poems, written between screens.</p>
    </div>
  </section>

  <section class="band">
    <p class="sub">Written in a notes app, set here in ink.</p>
    <div class="meander" aria-hidden="true"></div>
  </section>

  <main class="page">
    <div class="poems" id="poems" aria-live="polite"></div>
  </main>

  <footer class="p-foot">
    <div class="sprig" id="sprig-foot"></div>
    <p>© <span id="yr"></span> Rohit · <a class="back" href="index.html#end" data-turn="paper">Back to the hill</a></p>
  </footer>

  <script src="poems-art.js?v=5"></script>
  <script src="poems.js?v=8"></script>
  <script src="turn.js?v=4"></script>
</body>
</html>
